<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦曦AI 动态 Logo</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #071421;
  --cyan: #48efff;
  --cyan-deep: #10b8d6;
  --gold: #ffd66a;
  --gold-hot: #fff1b5;
  --silver: #e8edf4;
  --steel: #8d98a8;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 18px;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background:
    radial-gradient(circle at 30% 92%, rgba(20, 202, 232, 0.28), transparent 24%),
    radial-gradient(circle at 78% 22%, rgba(255, 214, 106, 0.16), transparent 20%),
    linear-gradient(140deg, #07111f 0%, #0b1d31 56%, #08131f 100%);
  color: #fff;
}

.logo-shell {
  width: min(1280px, 100%);
}

.logo-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  min-height: 420px;
  overflow: hidden;
  border-radius: 8px;
  background:
    linear-gradient(rgba(73, 203, 238, 0.18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(73, 203, 238, 0.18) 1px, transparent 1px),
    radial-gradient(circle at 49% 49%, rgba(72, 239, 255, 0.16), transparent 2px),
    linear-gradient(180deg, rgba(17, 43, 70, 0.92), rgba(6, 18, 31, 0.98));
  background-size: 122px 122px, 122px 122px, 122px 122px, auto;
  box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
  isolation: isolate;
}

.logo-stage::before,
.logo-stage::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.logo-stage::before {
  background:
    linear-gradient(90deg, transparent 0 16%, rgba(84, 205, 237, 0.28) 16.1%, transparent 16.3% 100%),
    linear-gradient(90deg, transparent 0 50%, rgba(118, 213, 239, 0.3) 50.1%, transparent 50.3% 100%),
    linear-gradient(90deg, transparent 0 71%, rgba(84, 205, 237, 0.2) 71.1%, transparent 71.3% 100%);
  opacity: 0.72;
}

.logo-stage::after {
  background:
    radial-gradient(circle at 50% 50%, transparent 0%, rgba(4, 10, 18, 0.18) 68%, rgba(2, 7, 13, 0.74) 100%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 24% 72%, rgba(73, 203, 238, 0.09));
  z-index: 1;
}

.circuit {
  position: absolute;
  inset: 0;
  z-index: 2;
  opacity: 0.58;
  background:
    linear-gradient(90deg, transparent 8%, rgba(105, 225, 255, 0.22) 8.2%, transparent 8.45% 30%, rgba(105, 225, 255, 0.14) 30.1%, transparent 30.3%),
    linear-gradient(180deg, transparent 12%, rgba(105, 225, 255, 0.16) 12.2%, transparent 12.45% 58%, rgba(105, 225, 255, 0.18) 58.2%, transparent 58.45%),
    radial-gradient(circle at 11% 17%, rgba(89, 232, 255, 0.62) 0 2px, transparent 3px),
    radial-gradient(circle at 38% 18%, rgba(89, 232, 255, 0.52) 0 2px, transparent 3px),
    radial-gradient(circle at 50% 50%, rgba(89, 232, 255, 0.62) 0 2px, transparent 3px),
    radial-gradient(circle at 71% 74%, rgba(89, 232, 255, 0.42) 0 2px, transparent 3px),
    radial-gradient(circle at 92% 17%, rgba(89, 232, 255, 0.42) 0 2px, transparent 3px);
  animation: circuitDrift 10s linear infinite;
}

.brand-lockup {
  position: absolute;
  inset: 0;
  z-index: 5;
}

.brand-word,
.brand-ai,
.xi-final,
.xi-carried,
.xi-origin {
  position: absolute;
  margin: 0;
  line-height: 0.92;
  letter-spacing: 0;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-weight: 900;
  white-space: nowrap;
}

.brand-word {
  left: 19%;
  top: 52%;
  transform: translate(-50%, -50%);
  font-size: clamp(132px, 17vw, 224px);
  color: var(--cyan);
  text-shadow:
    0 0 8px rgba(72, 239, 255, 0.96),
    0 0 22px rgba(72, 239, 255, 0.72),
    8px 12px 0 rgba(9, 118, 151, 0.62);
  animation: dreamPulse 8s ease-in-out infinite;
}

.brand-ai {
  left: 71%;
  top: 53%;
  transform: translate(-50%, -50%);
  font-size: clamp(126px, 16vw, 214px);
  background: linear-gradient(110deg, #ffffff 0%, var(--silver) 36%, #a8b2c1 63%, #f7fbff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 20px 32px rgba(0, 0, 0, 0.38);
}

.xi-origin {
  right: 5.6%;
  top: 11.5%;
  z-index: 7;
  font-size: clamp(52px, 6vw, 84px);
  color: var(--gold);
  text-shadow:
    0 0 9px rgba(255, 214, 106, 0.95),
    0 0 24px rgba(255, 184, 74, 0.62);
  animation: xiOrigin 8s ease-in-out infinite;
}

.xi-carried,
.xi-final {
  z-index: 9;
  font-size: clamp(78px, 8.9vw, 124px);
  color: var(--gold);
  text-shadow:
    0 0 5px #fff8d9,
    0 0 18px rgba(255, 214, 106, 0.94),
    0 0 38px rgba(255, 161, 49, 0.62);
}

.xi-carried {
  left: 86%;
  top: 30%;
  transform: translate(-50%, -50%);
  animation: xiCarry 8s cubic-bezier(0.2, 0.9, 0.18, 1) infinite;
}

.xi-final {
  left: 45.7%;
  top: 52%;
  transform: translate(-50%, -50%) scale(0.98);
  opacity: 0;
  animation: xiFinal 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
}

.cat-carrier {
  position: absolute;
  left: 91%;
  top: 34%;
  z-index: 10;
  width: clamp(150px, 20vw, 258px);
  aspect-ratio: 1;
  margin: 0;
  transform: translate(-50%, -50%);
  animation: catFlight 8s cubic-bezier(0.2, 0.9, 0.18, 1) infinite;
  filter: drop-shadow(0 16px 16px rgba(0, 0, 0, 0.32));
}

.cat-carrier img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: 27% 48%;
  border-radius: 50%;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 60%, rgba(0, 0, 0, 0.86) 69%, transparent 74%);
  mask-image: radial-gradient(circle at 50% 50%, #000 60%, rgba(0, 0, 0, 0.86) 69%, transparent 74%);
}

.cat-peek {
  position: absolute;
  left: 46%;
  bottom: -2%;
  z-index: 8;
  width: clamp(120px, 16vw, 206px);
  aspect-ratio: 1;
  margin: 0;
  opacity: 0;
  transform: translateX(-50%);
  animation: catPeek 8s ease-in-out infinite;
  filter: drop-shadow(0 18px 18px rgba(0, 0, 0, 0.34));
}

.cat-peek img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: 50% 42%;
  border-radius: 50%;
  -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 56%, transparent 72%);
  mask-image: radial-gradient(circle at 50% 45%, #000 56%, transparent 72%);
}

.sparkle {
  position: absolute;
  z-index: 6;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gold-hot);
  box-shadow: 0 0 10px rgba(255, 214, 106, 0.9);
  opacity: 0;
  animation: sparkle 8s ease-in-out infinite;
}

.sparkle.one { left: 81%; top: 31%; animation-delay: 0ms; }
.sparkle.two { left: 72%; top: 42%; animation-delay: 120ms; }
.sparkle.three { left: 56%; top: 45%; animation-delay: 240ms; }
.sparkle.four { left: 47%; top: 49%; animation-delay: 360ms; }

.shooting-line {
  position: absolute;
  z-index: 4;
  width: 110px;
  height: 2px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, rgba(255, 214, 106, 0.72), transparent);
  opacity: 0;
  transform: rotate(-13deg);
  animation: shootingLine 8s ease-in-out infinite;
}

.shooting-line.one { left: 64%; top: 35%; }
.shooting-line.two { left: 50%; top: 45%; animation-delay: 160ms; }

.replay {
  position: absolute;
  right: 20px;
  bottom: 20px;
  z-index: 20;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(110, 230, 255, 0.36);
  border-radius: 50%;
  color: #dffaff;
  background: rgba(3, 13, 24, 0.58);
  backdrop-filter: blur(12px);
  cursor: pointer;
}

.replay:hover {
  background: rgba(20, 56, 78, 0.72);
}

.replay svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.1;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.logo-stage.is-restarting * {
  animation: none !important;
}

@keyframes circuitDrift {
  0% { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(-24px, 16px, 0); }
}

@keyframes dreamPulse {
  0%,
  100% {
    text-shadow:
      0 0 8px rgba(72, 239, 255, 0.96),
      0 0 22px rgba(72, 239, 255, 0.72),
      8px 12px 0 rgba(9, 118, 151, 0.62);
  }
  50% {
    text-shadow:
      0 0 12px rgba(116, 248, 255, 1),
      0 0 36px rgba(72, 239, 255, 0.92),
      8px 12px 0 rgba(9, 118, 151, 0.72);
  }
}

@keyframes xiOrigin {
  0%,
  18% {
    opacity: 1;
    transform: scale(1);
  }
  32%,
  100% {
    opacity: 0.42;
    transform: scale(0.92);
  }
}

@keyframes xiCarry {
  0% {
    left: 88%;
    top: 30%;
    opacity: 1;
    transform: translate(-50%, -50%) rotate(0deg) scale(0.9);
  }
  18% {
    left: 86%;
    top: 30%;
    opacity: 1;
    transform: translate(-50%, -50%) rotate(0deg) scale(0.9);
  }
  42% {
    left: 66%;
    top: 43%;
    opacity: 1;
    transform: translate(-50%, -50%) rotate(-7deg) scale(0.98);
  }
  66% {
    left: 50.5%;
    top: 50%;
    opacity: 1;
    transform: translate(-50%, -50%) rotate(4deg) scale(1);
  }
  76% {
    left: 45.7%;
    top: 52%;
    opacity: 1;
    transform: translate(-50%, -50%) rotate(0deg) scale(1);
  }
  84%,
  100% {
    left: 45.7%;
    top: 52%;
    opacity: 0;
    transform: translate(-50%, -50%) rotate(0deg) scale(1);
  }
}

@keyframes xiFinal {
  0%,
  75% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.92);
  }
  84%,
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

@keyframes catFlight {
  0% {
    left: 99%;
    top: 37%;
    opacity: 0;
    transform: translate(-50%, -50%) rotate(-11deg) scale(0.84);
  }
  15% {
    left: 88%;
    top: 35%;
    opacity: 1;
    transform: translate(-50%, -50%) rotate(-8deg) scale(0.92);
  }
  42% {
    left: 70%;
    top: 45%;
    opacity: 1;
    transform: translate(-50%, -50%) rotate(6deg) scale(1.04);
  }
  66% {
    left: 55%;
    top: 44%;
    opacity: 1;
    transform: translate(-50%, -50%) rotate(-4deg) scale(1.05);
  }
  78% {
    left: 45%;
    top: 57%;
    opacity: 1;
    transform: translate(-50%, -50%) rotate(0deg) scale(0.95);
  }
  90%,
  100% {
    left: 38%;
    top: 76%;
    opacity: 0;
    transform: translate(-50%, -50%) rotate(0deg) scale(0.86);
  }
}

@keyframes catPeek {
  0%,
  80% {
    opacity: 0;
    transform: translateX(-50%) translateY(28px) scale(0.92);
  }
  90%,
  100% {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
}

@keyframes sparkle {
  0%,
  15%,
  82%,
  100% {
    opacity: 0;
    transform: translate3d(20px, -6px, 0) scale(0.4);
  }
  35%,
  70% {
    opacity: 1;
    transform: translate3d(-22px, 10px, 0) scale(1);
  }
}

@keyframes shootingLine {
  0%,
  20%,
  80%,
  100% {
    opacity: 0;
    transform: translateX(28px) rotate(-13deg);
  }
  36%,
  62% {
    opacity: 1;
    transform: translateX(-18px) rotate(-13deg);
  }
}

@media (max-width: 720px) {
  body {
    padding: 10px;
  }

  .logo-stage {
    min-height: 520px;
    aspect-ratio: 9 / 12;
    background-size: 84px 84px, 84px 84px, 84px 84px, auto;
  }

  .brand-word {
    left: 28%;
    top: 48%;
    font-size: clamp(112px, 30vw, 166px);
  }

  .brand-ai {
    left: 70%;
    top: 49%;
    font-size: clamp(92px, 25vw, 140px);
  }

  .xi-origin {
    right: 8%;
    top: 10%;
  }

  .xi-final {
    left: 49%;
    top: 48%;
  }

  .cat-peek {
    left: 49%;
    bottom: 9%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .circuit,
  .brand-word,
  .xi-origin,
  .xi-carried,
  .xi-final,
  .cat-carrier,
  .cat-peek,
  .sparkle,
  .shooting-line {
    animation-duration: 1ms;
    animation-iteration-count: 1;
  }

  .xi-final {
    opacity: 1;
  }

  .xi-carried,
  .cat-carrier,
  .sparkle,
  .shooting-line {
    opacity: 0;
  }
}
</style>
</head>
<body>
  <main class="logo-shell" aria-label="梦曦AI 动态 Logo">
    <section class="logo-stage" id="logoStage">
      <div class="circuit" aria-hidden="true"></div>

      <div class="brand-lockup" aria-hidden="true">
        <span class="brand-word">梦</span>
        <span class="brand-ai">AI</span>
        <span class="xi-origin">曦</span>
        <span class="xi-carried">曦</span>
        <span class="xi-final">曦</span>
      </div>

      <figure class="cat-carrier" aria-hidden="true">
        <img src="assets/logo/cat-side.png" alt="">
      </figure>

      <figure class="cat-peek" aria-hidden="true">
        <img src="assets/logo/cat-front.png" alt="">
      </figure>

      <span class="sparkle one" aria-hidden="true"></span>
      <span class="sparkle two" aria-hidden="true"></span>
      <span class="sparkle three" aria-hidden="true"></span>
      <span class="sparkle four" aria-hidden="true"></span>
      <span class="shooting-line one" aria-hidden="true"></span>
      <span class="shooting-line two" aria-hidden="true"></span>

      <button class="replay" type="button" aria-label="重播动画" title="重播动画" id="replayLogo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7"></path>
          <path d="M3 4v6h6"></path>
        </svg>
      </button>
    </section>
  </main>

<script>
const stage = document.getElementById("logoStage");
const replay = document.getElementById("replayLogo");

replay.addEventListener("click", () => {
  stage.classList.add("is-restarting");
  window.requestAnimationFrame(() => {
    window.requestAnimationFrame(() => {
      stage.classList.remove("is-restarting");
    });
  });
});
</script>
</body>
</html>
